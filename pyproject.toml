[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula3d"
# Single source of truth: src/nebula3d/_version.py (see [tool.setuptools.dynamic]).
dynamic = ["version"]
description = "3D diffuse neutron scattering processing: powder ring removal and 3D-ΔPDF"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Tsung-han Yang" }]
keywords = ["neutron scattering", "diffuse scattering", "crystallography", "inpainting"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "h5py>=3.8",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2",
]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "httpx2",  # starlette.testclient (fastapi TestClient) transport
]
docs = [
    "sphinx",
    "sphinx-autodoc-typehints",
    "myst-parser",
]

[project.scripts]
nebula3d-web = "nebula3d.server.cli:main"

[project.urls]
Repository = "https://github.com/drthyang/nebula3d"
Changelog = "https://github.com/drthyang/nebula3d/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "nebula3d._version.__version__" }

[tool.setuptools.package-data]
"nebula3d.server" = ["static/**/*"]

[tool.setuptools.exclude-package-data]
# Never ship experimental data or a (stale, self-nesting) copy of the Pyodide
# wheel: both can land in server/static/ (export scripts; `vite build` copying
# web/public).  scripts/build_web_wheel.py inspects the wheel as a second guard.
"nebula3d.server" = ["static/data/*", "static/wheels/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN"]
# E741: crystallographic variables l (Miller index) and I (intensity) are conventional
# E702: compact semicolon-separated statements common in scientific helpers
ignore = ["E741", "E702"]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["ANN", "E402"]
"tests/**" = ["ANN"]

[tool.mypy]
# Type-check against the 3.12 target: numpy >= 2.4 ships stubs that use the
# `type` statement, which mypy rejects for older targets (runtime support for
# 3.10+ is covered by the CI test matrix and ruff's py310 target).
python_version = "3.12"
strict = false
disable_error_code = ["type-arg", "no-any-return", "unused-ignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is a CI flag (`pytest --cov=nebula3d`, .github/workflows/ci.yml);
# keeping it out of addopts makes the default local run ~40 % faster.
