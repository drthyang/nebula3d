name: CI

on:
  push:
    branches: [main]
  pull_request:

# The validation's held-out test split runs only on this opt-in, under masked
# names (tests/conftest.py): a local run leaves it out of the output that whoever
# tunes reads, and CI covers it in every job, the Pyodide-pinned one included.
# The scenario evals' held-out fixture loads on it too (web/src/llm/evals/
# heldoutFixture.ts), so the frontend job's `npm run test` replays them.
# test_ci_runs_the_test_split pins this block.
env:
  NEBULA_HOLDOUT_TESTS: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every leg: one red leg used to cancel the others mid-run, hiding
      # whether the failure was version-specific.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package with dev + web dependencies
        run: pip install -e ".[dev,web]"

      - name: Run tests
        run: pytest --tb=short --cov=nebula3d --cov-report=term-missing

      - name: Lint
        run: ruff check src/ tests/

  # mypy's verdict depends on the installed numpy *stubs*, which differ between
  # the numpy each Python resolves and drift with every numpy release (main was
  # red for two months on exactly that).  Type-check once, against a pinned
  # pair (.github/constraints/typecheck.txt) that is bumped deliberately.
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (pinned numpy + mypy)
        run: pip install -e ".[dev,web]" -c .github/constraints/typecheck.txt

      - name: Type check
        run: mypy src/nebula3d --ignore-missing-imports --python-version 3.12

  # The browser runs the pipeline on Pyodide's numeric stack, not on the latest
  # PyPI releases the matrix above resolves.  Run the suite under the exact
  # numpy/scipy/h5py/matplotlib Pyodide ships so an API that only exists in a
  # newer release fails here instead of at runtime in a user's browser.
  test-browser-pins:
    name: test (Pyodide 0.27.7 pins)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package (Pyodide 0.27.7 numeric stack)
        run: pip install -e ".[dev,web]" -c .github/constraints/pyodide-0.27.7.txt

      - name: Run tests
        run: pytest --tb=short

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The replay tests (vitest's replay project) run the Pages build's own
      # path, the engine's Worker messages answered by nebula3d.webbridge, with
      # a CPython bridge in place of Pyodide (web/src/llm/evals/devData/). So
      # this Python is the browser's: Pyodide 0.27.7 ships CPython 3.12
      # (3.12.7) and the numeric stack its constraints file pins. The check
      # below fails when the minor version or any pin differs, and
      # devData/pins.test.ts ties this job to the Pyodide the Pages build loads.
      - name: Set up Python (Pyodide 0.27.7's CPython 3.12)
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package (Pyodide 0.27.7 numeric stack)
        working-directory: .
        run: pip install -e . -c .github/constraints/pyodide-0.27.7.txt

      - name: Check the Python against the browser's pins
        run: '"${{ steps.python.outputs.python-path }}" src/llm/evals/devData/bridge.py check --pins ../.github/constraints/pyodide-0.27.7.txt'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          NEBULA_PYTHON: ${{ steps.python.outputs.python-path }}

      # Both bundles: the native SPA baked into the wheel and the Pages /
      # Pyodide build (different base path, publicDir and env).
      - name: Type check and build (native + Pages modes)
        run: npm run build && npm run build:pages
