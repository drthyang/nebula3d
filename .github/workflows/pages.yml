# Build the backend-less SPA and deploy it to GitHub Pages.
#
# The Pages build runs the *real* nebula3d reduction pipeline in the user's browser
# via Pyodide (see web/.env.pages → VITE_DATA_MODE=pyodide, web/src/api/
# pyodideEngine.ts).  The pipeline code ships as a data-free `nebula3d` wheel that
# the page micropip-installs at runtime; the wheel is gitignored (a careless
# build could bundle experimental data), so CI builds it fresh here — data-free —
# with scripts/build_web_wheel.py into web/public/wheels/<sha256>/ before
# `vite build` copies it into the bundle.  No data is hosted: users supply their
# own volume at runtime.
#
# Gated on CI: this workflow runs when the "CI" workflow finishes on main and
# deploys only if it succeeded, checking out the exact commit CI tested — a push
# that breaks tests, lint, types or the frontend build can no longer reach the
# live site.  `workflow_dispatch` still allows a manual deploy of main.
name: Pages

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit CI just validated (falls back to main for manual runs).
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data-free nebula3d wheel + manifest
        working-directory: .
        # Builds the wheel, refuses any data / nested-wheel payload, publishes it
        # content-addressed under web/public/wheels/<sha256[:12]>/ and writes
        # the manifest both Pyodide workers resolve it from at boot.
        run: |
          python -m pip install --upgrade pip
          python scripts/build_web_wheel.py
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build SPA (Pyodide mode)
        run: npm run build:pages
      # ONE-TIME SETUP: enable Pages first, or this step fails with "Get Pages
      # site failed / Not Found". Repo Settings → Pages → Build and deployment →
      # Source: "GitHub Actions". (The workflow token cannot create the site
      # itself, so this must be done manually once.)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
